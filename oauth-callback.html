<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S8JU 로그인</title>
    <style>
      :root { color-scheme: light; font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f2ea; color: #111; }
      main { width: min(420px, calc(100% - 40px)); padding: 36px 28px; border: 1px solid #ddd5c9; border-radius: 28px; background: #fffdf8; text-align: center; }
      .brand { font-size: 18px; font-weight: 900; letter-spacing: .18em; }
      h1 { margin: 24px 0 10px; font-size: 24px; }
      p { margin: 0; color: #6b665f; line-height: 1.65; }
      .dot { display: inline-block; width: 8px; height: 8px; margin-top: 24px; border-radius: 50%; background: #111; animation: pulse 1s infinite alternate; }
      @keyframes pulse { to { opacity: .25; transform: scale(.75); } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">S8JU</div>
      <h1>로그인을 확인하고 있어요</h1>
      <p>잠시 후 이 창이 자동으로 닫힙니다.</p>
      <span class="dot" aria-hidden="true"></span>
    </main>
  </body>
</html>
